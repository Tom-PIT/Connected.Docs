site_name: Tom PIT Connected Documentation

repo_url: https://github.com/Tom-PIT/Connected.Docs/tree/main

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  
  favicon: img/favicon.ico
  
  palette:
    primary: blue
    accent: blue grey
  
  icon:
    logo: material/office-building
  
  features:
    - navigation.tabs
  #  - navigation.expand
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path 
    - search.suggest
    - search.highlight
    - navigation.footer

plugins:
  - search
  - callouts

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - English:
      - Introduction: en/README.md
      - Getting started: en/GettingStarted/00.GettingStarted.md
      - Common features: en/Common/README.md
      - Navigation: en/Common/UI/Navigation.md
      - Management index: en/ManagementIndex.md
      - Domains:
        - Overview: en/Domains/README.md
        - Production: 
            - Overview: en/Domains/Production/README.md
            - Production Orders: en/Domains/Production/Documents/ProductionOrders.md
        - Assets: 
